# ==============================================================================
#  Module 1: Morning Bias Engine & Pre-Market System Health Check Config
#  Master Architecture & Requirements v2.1 (Hardened + Library Locked)
# ==============================================================================

version: "2.1"
timezone: "Asia/Kolkata"
fail_closed: true

symbols:
  sp500: "^GSPC"
  sp500_fallback: "SPY"
  vix: "^INDIAVIX"
  nifty: "^NSEI"
  banknifty: "^NSEBANK"
  gift_nifty_proxy: "^NSEI" # yfinance proxy for Nifty futures sentiment

scrip_master:
  url: "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"
  min_file_size_bytes: 10485760 # 10 MB minimum file size
  timeout_seconds: 30
  raw_output_path: "data/scrip_master_raw.json"
  clean_output_path: "data/scrip_master_clean.json"

thresholds:
  high_vix: 14.0            # High VIX (>14): Directional Option Buying (ATM/ITM)
  low_vix: 12.0             # Low VIX (<12): Option Selling / Credit Spreads
  sp500_bullish_pct: 0.30
  sp500_bearish_pct: -0.30
  gap_up_pct: 0.20
  gap_down_pct: -0.20

outputs:
  report_file: "data/morning_bias_report.json"
  daily_levels_file: "data/daily_levels.json"
  system_status_file: "data/system_status.json"
  tokens_file: "data/tokens.json"
  db_file: "data/trader.db"
  active_params_file: "config/active_params.yaml"
